services:

    postgres:
        image: postgres:16
        ports:
            - "5433:5432"
        restart: unless-stopped
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-airflow}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-airflow}
            - POSTGRES_DB=${POSTGRES_DB:-airflow}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        logging:
            options:
                max-size: 10m
                max-file: "3"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
            interval: 10s
            timeout: 5s
            retries: 5


    airflow-init:
        image: local/airflow:2.10.5
        build:
            context: .
            dockerfile: Dockerfile.airflow
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            - AIRFLOW__CORE__EXECUTOR=LocalExecutor
            - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
            - AIRFLOW__CORE__FERNET_KEY=${FERNET_KEY:-}
            - AIRFLOW__CORE__LOAD_EXAMPLES=False
            - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
            - AIRFLOW_DATA_DIR=${AIRFLOW_DATA_DIR:-/opt/airflow}
            - AIRFLOW_CONN_ANALYTICS_DB=postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
            - AIRFLOW_ADMIN_USERNAME=${AIRFLOW_ADMIN_USERNAME:-admin}
            - AIRFLOW_ADMIN_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:-change-me}
            - AIRFLOW_ADMIN_EMAIL=${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
            - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
        user: "${AIRFLOW_UID:-50000}:0"
        command: >-
            bash -c "airflow db migrate &&
            (airflow users create --username $${AIRFLOW_ADMIN_USERNAME}
            --password $${AIRFLOW_ADMIN_PASSWORD} --firstname Airflow
            --lastname Admin --role Admin --email $${AIRFLOW_ADMIN_EMAIL} ||
            airflow users list | grep -Fq \"$${AIRFLOW_ADMIN_USERNAME}\")"

    webserver:
        image: local/airflow:2.10.5
        build:
            context: .
            dockerfile: Dockerfile.airflow
        restart: unless-stopped
        depends_on:
            airflow-init:
                condition: service_completed_successfully
        environment:
            - AIRFLOW__CORE__EXECUTOR=LocalExecutor
            - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
            - AIRFLOW__CORE__FERNET_KEY=${FERNET_KEY:-}
            - AIRFLOW__CORE__LOAD_EXAMPLES=False
            - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
            - AIRFLOW_DATA_DIR=${AIRFLOW_DATA_DIR:-/opt/airflow}
            - AIRFLOW_CONN_ANALYTICS_DB=postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
            - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
            - DATA_QUALITY_MIN_ROWS=${DATA_QUALITY_MIN_ROWS:-40000}
            - DATA_QUALITY_MAX_ROWS=${DATA_QUALITY_MAX_ROWS:-60000}
            - DATA_QUALITY_MAX_NULL_RATE=${DATA_QUALITY_MAX_NULL_RATE:-0.25}
            - DATA_QUALITY_MIN_PRICE=${DATA_QUALITY_MIN_PRICE:-0}
            - DATA_QUALITY_MAX_PRICE=${DATA_QUALITY_MAX_PRICE:-10000}
        volumes:
            - ./dags:/opt/airflow/dags
            - ./input_files:${AIRFLOW_DATA_DIR:-/opt/airflow}/input_files
            - ./output_files:${AIRFLOW_DATA_DIR:-/opt/airflow}/output_files
            - ./logs:/opt/airflow/logs

        ports:
            - "8080:8080"
        command: webserver
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
            interval: 30s
            timeout: 10s
            retries: 5

    scheduler:
        image: local/airflow:2.10.5
        build:
            context: .
            dockerfile: Dockerfile.airflow
        restart: unless-stopped
        depends_on:
            airflow-init:
                condition: service_completed_successfully
        environment:
            - AIRFLOW__CORE__EXECUTOR=LocalExecutor
            - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
            - AIRFLOW__CORE__FERNET_KEY=${FERNET_KEY:-}
            - AIRFLOW__CORE__LOAD_EXAMPLES=False
            - AIRFLOW_DATA_DIR=${AIRFLOW_DATA_DIR:-/opt/airflow}
            - AIRFLOW_CONN_ANALYTICS_DB=postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
            - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
            - DATA_QUALITY_MIN_ROWS=${DATA_QUALITY_MIN_ROWS:-40000}
            - DATA_QUALITY_MAX_ROWS=${DATA_QUALITY_MAX_ROWS:-60000}
            - DATA_QUALITY_MAX_NULL_RATE=${DATA_QUALITY_MAX_NULL_RATE:-0.25}
            - DATA_QUALITY_MIN_PRICE=${DATA_QUALITY_MIN_PRICE:-0}
            - DATA_QUALITY_MAX_PRICE=${DATA_QUALITY_MAX_PRICE:-10000}
        volumes:
            - ./dags:/opt/airflow/dags
            - ./input_files:${AIRFLOW_DATA_DIR:-/opt/airflow}/input_files
            - ./output_files:${AIRFLOW_DATA_DIR:-/opt/airflow}/output_files
            - ./logs:/opt/airflow/logs
        command: scheduler

    analytics-api:
        build:
            context: .
            dockerfile: Dockerfile.api
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            - ANALYTICS_DATABASE_DSN=postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
            - LOG_LEVEL=${LOG_LEVEL:-INFO}
            - ENVIRONMENT=${ENVIRONMENT:-development}
            - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
            - OIDC_ISSUER=${OIDC_ISSUER:-}
            - OIDC_AUDIENCE=${OIDC_AUDIENCE:-}
            - OIDC_JWKS_URL=${OIDC_JWKS_URL:-}
            - OIDC_ROLES_CLAIM=${OIDC_ROLES_CLAIM:-roles}
            - AIRFLOW_API_URL=${AIRFLOW_API_URL:-http://webserver:8080/api/v1}
            - AIRFLOW_USERNAME=${AIRFLOW_USERNAME:-admin}
            - AIRFLOW_PASSWORD=${AIRFLOW_PASSWORD:-}
            - OPERATIONS_API_KEY=${OPERATIONS_API_KEY:-}
            - FRESHNESS_THRESHOLD_HOURS=${FRESHNESS_THRESHOLD_HOURS:-24}
            - DATA_QUALITY_MAX_NULL_RATE=${DATA_QUALITY_MAX_NULL_RATE:-0.25}
            - DATA_QUALITY_MIN_PRICE=${DATA_QUALITY_MIN_PRICE:-0}
            - DATA_QUALITY_MAX_PRICE=${DATA_QUALITY_MAX_PRICE:-10000}
        ports:
            - "${API_PORT:-8000}:8000"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
            interval: 30s
            timeout: 5s
            retries: 5

    dashboard:
        image: python:3.12-slim
        working_dir: /app
        restart: unless-stopped
        depends_on:
            analytics-api:
                condition: service_started
        environment:
            - OPERATIONS_API_KEY=${OPERATIONS_API_KEY:-}
            - API_BASE=http://analytics-api:8000
            - DASHBOARD_HOST=0.0.0.0
        volumes:
            - .:/app
        ports:
            - "5173:5173"
        command: python dashboard/server.py
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5173/')"]
            interval: 30s
            timeout: 5s
            retries: 5

volumes:
    postgres_data: